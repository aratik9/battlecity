
<!DOCTYPE html>
<html lang="mr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Battle City Tank Wars</title>
<style>
*{box-sizing:border-box}
body{
 margin:0;background:#10151d;color:white;
 font-family:monospace;text-align:center;
 touch-action:manipulation;user-select:none
}
h2{color:#ffd447;margin:12px 0}
#stats{display:flex;justify-content:center;gap:7px;flex-wrap:wrap;margin:8px}
#stats span{background:#263443;padding:8px;border-radius:5px}
canvas{
 display:block;width:min(96vw,360px);height:auto;
 margin:10px auto;background:#243b2b;
 border:3px solid #8495a6;image-rendering:pixelated;
 touch-action:none
}
button{
 background:#293b4d;color:white;border:2px solid #8296a9;
 border-radius:9px;font:bold 17px monospace;padding:13px;
 touch-action:none
}
button:active{background:#ffcc44;color:#111}
#start{background:#b88a15;color:#111;width:200px;margin:5px}
#pad{
 display:grid;grid-template-columns:65px 65px 65px;
 grid-template-rows:53px 53px;gap:6px;
 justify-content:center;margin:12px auto
}
#pad button{padding:4px;font-size:23px}
#fire{background:#a52d32;width:135px;height:58px}
#msg{color:#ffdf70;min-height:20px;margin:6px}
small{color:#bdc9d5;display:block;margin:10px}
</style>
</head>
<body>
<h2>⚔ BATTLE CITY</h2>
<div id="stats">
 <span>Score: <b id="score">0</b></span>
 <span>Lives: <b id="lives">3</b></span>
 <span>Level: <b id="level">1</b></span>
</div>

<canvas id="c" width="360" height="480"></canvas>
<div id="msg">START दाबून गेम सुरू करा!</div>
<button id="start">▶ START GAME</button>

<div id="pad">
 <span></span><button data-move="0">⬆</button><span></span>
 <button data-move="3">⬅</button>
 <button data-move="2">⬇</button>
 <button data-move="1">➡</button>
</div>
<button id="fire">🔥 FIRE</button>
<small>Keyboard: WASD / Arrow Keys · Shoot: Space</small>

<script>
(function(){
"use strict";

const canvas=document.getElementById("c");
const ctx=canvas.getContext("2d");
const W=360,H=480,T=24;
const $=id=>document.getElementById(id);
const held={};
const dirs=[
 {x:0,y:-1},{x:1,y:0},{x:0,y:1},{x:-1,y:0}
];

let player=null,enemies=[],bullets=[],walls=[],items=[];
let score=0,lives=3,level=1;
let running=false,over=false,last=0;
let spawnClock=0,levelDelay=0,notice="";
let noticeTime=0,baseHP=3;

function say(s){
 notice=s;noticeTime=2.5;
 $("msg").textContent=s;
}
function updateHUD(){
 $("score").textContent=score;
 $("lives").textContent=lives;
 $("level").textContent=level;
}
function box(x,y,w,h,color){
 ctx.fillStyle=color;ctx.fillRect(x,y,w,h);
}
function circle(x,y,r,color){
 ctx.fillStyle=color;
 ctx.beginPath();ctx.arc(x,y,r,0,Math.PI*2);ctx.fill();
}
function newWall(x,y,type="brick",hp=2){
 walls.push({x,y,w:T,h:T,type,hp});
}
function buildWorld(){
 walls=[];
 // Solid border
 for(let x=0;x<W;x+=T){
  newWall(x,0,"steel",999);
  newWall(x,H-T,"steel",999);
 }
 for(let y=T;y<H-T;y+=T){
  newWall(0,y,"steel",999);
  newWall(W-T,y,"steel",999);
 }
 // Random brick formations, away from base and spawn
 for(let y=96;y<360;y+=T){
  for(let x=T;x<W-T;x+=T){
   if(Math.random()<0.12 && !(x>=120&&x<=216&&y>=312)){
    newWall(x,y,"brick",2);
   }
  }
 }
 // Base protection
 newWall(120,408,"brick",3);
 newWall(216,408,"brick",3);
 newWall(120,432,"brick",3);
 newWall(216,432,"brick",3);
 baseHP=3;
}
function tank(x,y,dir,color,boss=false){
 return {x,y,dir,color,boss,
  size:boss?28:18,
  hp:boss?6+level*2:1,
  maxHp:boss?6+level*2:1,
  speed:boss?35:60+Math.min(level*3,30),
  cool:0,turn:0,inv:0,power:0};
}
function circleRect(x,y,r,w){
 let nx=Math.max(w.x,Math.min(x,w.x+w.w));
 let ny=Math.max(w.y,Math.min(y,w.y+w.h));
 return (x-nx)**2+(y-ny)**2<r*r;
}
function free(x,y,r=9,ignore=null){
 if(x-r<0||x+r>W||y-r<0||y+r>H)return false;
 for(const w of walls){
  if(circleRect(x,y,r,w))return false;
 }
 if(ignore!==player && player &&
    Math.hypot(x-player.x,y-player.y)<r+9)return false;
 for(const e of enemies){
  if(e!==ignore&&e.hp>0&&
    Math.hypot(x-e.x,y-e.y)<r+(e.boss?14:9))return false;
 }
 // Protect the base
 if(x+r>168&&x-r<192&&y+r>432&&y-r<456)return false;
 return true;
}
function move(t,dx,dy){
 let r=t.boss?13:8;
 let nx=t.x+dx,ny=t.y+dy;
 if(Math.abs(dx)>0.001)t.dir=dx>0?1:3;
 if(Math.abs(dy)>0.001)t.dir=dy>0?2:0;
 if(free(nx,t.y,r,t))t.x=nx;
 if(free(t.x,ny,r,t))t.y=ny;
}
function spawnEnemy(boss=false){
 let spots=[[48,48],[180,48],[312,48],[72,72],[288,72]];
 for(let i=0;i<spots.length;i++){
  let p=spots[Math.floor(Math.random()*spots.length)];
  if(free(p[0],p[1],boss?14:9)){
   let e=tank(p[0],p[1],2,boss?"#b65bff":"#ff6655",boss);
   e.turn=.3;e.cool=.8+Math.random();
   enemies.push(e);
   return true;
  }
 }
 return false;
}
function beginLevel(){
 buildWorld();
 enemies=[];bullets=[];items=[];
 spawnClock=0.5;levelDelay=0;
 for(let i=0;i<Math.min(2+level,5);i++)spawnEnemy();
 if(level%3===0)spawnEnemy(true);
 player.x=180;player.y=384;player.dir=0;player.inv=2;
 say(level%3===0?"BOSS LEVEL!":"LEVEL "+level);
 updateHUD();
}
function startGame(){
 score=0;lives=3;level=1;
 bullets=[];items=[];enemies=[];over=false;
 player=tank(180,384,0,"#62ed7c");
 player.inv=2;player.power=0;
 running=true;
 beginLevel();
 updateHUD();
 $("start").textContent="↻ RESTART";
}
function shoot(t,isEnemy=false){
 if(t.cool>0)return;
 t.cool=isEnemy?(t.boss?.85:1.15):
  (t.power>0?.16:.35);
 const d=dirs[t.dir];
 bullets.push({
  x:t.x+d.x*(t.boss?18:13),
  y:t.y+d.y*(t.boss?18:13),
  vx:d.x*(isEnemy?115:230),
  vy:d.y*(isEnemy?115:230),
  enemy:isEnemy,damage:t.boss?2:1
 });
}
function drop(x,y){
 const types=["rapid","shield","life","bomb"];
 items.push({x,y,type:types[Math.floor(Math.random()*types.length)],time:10});
}
function loseLife(){
 lives--;
 player.inv=1.8;
 player.x=180;player.y=384;
 say("TANK HIT!");
 updateHUD();
 if(lives<=0)finish("GAME OVER");
}
function finish(s){
 running=false;over=true;
 say(s);
 $("start").textContent="↻ PLAY AGAIN";
}
function update(dt){
 if(!running)return;
 player.cool=Math.max(0,player.cool-dt);
 player.inv=Math.max(0,player.inv-dt);
 player.power=Math.max(0,player.power-dt);

 let dx=0,dy=0;
 if(held.ArrowUp||held.w)dy--;
 if(held.ArrowDown||held.s)dy++;
 if(held.ArrowLeft||held.a)dx--;
 if(held.ArrowRight||held.d)dx++;
 if(dx&&dy){dx*=.707;dy*=.707}
 move(player,dx*125*dt,dy*125*dt);
 if(held.Space||held.fire)shoot(player);

 spawnClock-=dt;
 if(spawnClock<=0&&enemies.length<Math.min(3+level,7)){
  spawnEnemy();spawnClock=2.4;
 }

 for(const e of enemies){
  if(e.hp<=0)continue;
  e.cool=Math.max(0,e.cool-dt);
  e.turn-=dt;
  let tx=player.x-e.x,ty=player.y-e.y;
  if(e.turn<=0){
   if(Math.random()<.7){
    e.dir=Math.abs(tx)>Math.abs(ty)?
      (tx>0?1:3):(ty>0?2:0);
   }else e.dir=Math.floor(Math.random()*4);
   e.turn=.5+Math.random();
  }
  const d=dirs[e.dir];
  let ox=e.x,oy=e.y;
  move(e,d.x*e.speed*dt,d.y*e.speed*dt);
  if(Math.abs(e.x-ox)+Math.abs(e.y-oy)<.01){
   e.dir=Math.floor(Math.random()*4);e.turn=.3;
  }
  // Aim towards the player occasionally
  if(Math.random()<.025){
   e.dir=Math.abs(tx)>Math.abs(ty)?
    (tx>0?1:3):(ty>0?2:0);
  }
  if(e.cool<=0)shoot(e,true);
 }

 for(let i=bullets.length-1;i>=0;i--){
  let b=bullets[i],hit=false;
  b.x+=b.vx*dt;b.y+=b.vy*dt;
  if(b.x<0||b.x>W||b.y<0||b.y>H){
   bullets.splice(i,1);continue;
  }
  for(let j=walls.length-1;j>=0;j--){
   let w=walls[j];
   if(b.x>=w.x&&b.x<=w.x+w.w&&
      b.y>=w.y&&b.y<=w.y+w.h){
    if(w.type==="brick"){
     w.hp--;
     if(w.hp<=0)walls.splice(j,1);
    }
    hit=true;break;
   }
  }
  if(hit){bullets.splice(i,1);continue;}

  // Base is a separate target
  if(b.x>=168&&b.x<=192&&b.y>=432&&b.y<=456){
   if(b.enemy){
    baseHP--;
    say("BASE UNDER ATTACK!");
    if(baseHP<=0){finish("BASE DESTROYED!");return;}
   }
   bullets.splice(i,1);continue;
  }

  if(b.enemy){
   if(player.inv<=0&&Math.hypot(b.x-player.x,b.y-player.y)<10){
    bullets.splice(i,1);loseLife();
    if(!running)return;
   }
  }else{
   for(const e of enemies){
    if(e.hp>0&&Math.hypot(b.x-e.x,b.y-e.y)<(e.boss?17:11)){
     e.hp-=b.damage;
     bullets.splice(i,1);
     if(e.hp<=0){
      score+=e.boss?500:100;
      if(Math.random()<.45)drop(e.x,e.y);
     }
     break;
    }
   }
  }
 }

 for(let i=items.length-1;i>=0;i--){
  const p=items[i];p.time-=dt;
  if(p.time<=0){items.splice(i,1);continue;}
  if(Math.hypot(player.x-p.x,player.y-p.y)<17){
   if(p.type==="rapid")player.power=8;
   if(p.type==="shield")player.inv=7;
   if(p.type==="life")lives=Math.min(5,lives+1);
   if(p.type==="bomb"){
    enemies.forEach(e=>{
     if(e.hp>0){score+=e.boss?500:100;e.hp=0;}
    });
   }
   items.splice(i,1);say("POWER-UP!");
  }
 }
 enemies=enemies.filter(e=>e.hp>0);
 if(enemies.length===0){
  level++;
  beginLevel();
 }
 updateHUD();
}
function drawTank(t){
 ctx.save();ctx.translate(t.x,t.y);
 ctx.rotate(t.dir*Math.PI/2);
 let s=t.boss?28:18;
 box(-s*.48,-s*.4,s*.23,s*.8,"#17201c");
 box(s*.25,-s*.4,s*.23,s*.8,"#17201c");
 box(-s*.27,-s*.35,s*.54,s*.7,t.color);
 box(-s*.09,-s*.68,s*.18,s*.48,"#e5efdb");
 circle(0,0,s*.22,t.boss?"#efbaff":"#b9f8b8");
 ctx.restore();
 if(t.boss){
  box(t.x-19,t.y-23,38,4,"#522a52");
  box(t.x-19,t.y-23,38*Math.max(0,t.hp/t.maxHp),4,"#ff4242");
 }
}
function draw(){
 box(0,0,W,H,"#263e2c");
 // Grass details
 ctx.fillStyle="#304b34";
 for(let y=12;y<H;y+=24)
  for(let x=12;x<W;x+=24)
   if((x+y)%3===0)ctx.fillRect(x,y,2,2);

 for(const w of walls){
  if(w.type==="steel"){
   box(w.x,w.y,T,T,"#667a8a");
   box(w.x+3,w.y+3,T-6,T-6,"#354755");
  }else{
   box(w.x,w.y,T,T,"#a65d32");
   ctx.strokeStyle="#f0a36d";ctx.lineWidth=2;
   ctx.strokeRect(w.x+1,w.y+1,T-2,T-2);
   ctx.beginPath();ctx.moveTo(w.x,w.y+12);
   ctx.lineTo(w.x+T,w.y+12);
   ctx.moveTo(w.x+12,w.y);ctx.lineTo(w.x+12,w.y+12);
   ctx.stroke();
  }
 }
 // Base
 box(168,432,24,24,"#ffe16a");
 box(172,436,16,16,"#304353");
 ctx.fillStyle="#fff";ctx.font="16px monospace";
 ctx.fillText("★",172,450);
 box(8,8,baseHP*15,4,"#58f28a");

 for(const p of items){
  const colors={rapid:"#50eaff",shield:"#7890ff",life:"#ff668c",bomb:"#ffdb45"};
  circle(p.x,p.y,9,colors[p.type]);
  ctx.fillStyle="#111";ctx.font="bold 11px monospace";
  ctx.textAlign="center";
  ctx.fillText({rapid:"R",shield:"S",life:"+",bomb:"B"}[p.type],p.x,p.y+4);
 }
 for(const e of enemies)drawTank(e);
 if(player){
  if(player.inv<=0||Math.floor(performance.now()/100)%2===0)
   drawTank(player);
  if(player.inv>0){
   ctx.strokeStyle="#8deeff";ctx.lineWidth=2;
   ctx.beginPath();ctx.arc(player.x,player.y,15,0,Math.PI*2);ctx.stroke();
  }
 }
 for(const b of bullets)circle(b.x,b.y,3,b.enemy?"#ff7060":"#fff4a5");

 if(!running){
  box(22,185,316,100,"rgba(0,0,0,.88)");
  ctx.fillStyle="#ffd34b";ctx.textAlign="center";
  ctx.font="bold 24px monospace";
  ctx.fillText(over?"GAME OVER":"BATTLE CITY",180,225);
  ctx.fillStyle="white";ctx.font="13px monospace";
  ctx.fillText("TAP START GAME BELOW",180,253);
 }
 ctx.textAlign="left";
}
function loop(now){
 const dt=Math.min((now-last)/1000||0,.04);
 last=now;
 update(dt);draw();
 requestAnimationFrame(loop);
}

$("start").addEventListener("click",startGame);

document.addEventListener("keydown",e=>{
 let k=e.key;
 if(["ArrowUp","ArrowDown","ArrowLeft","ArrowRight"," "].includes(k))
  e.preventDefault();
 if(k===" ")k="Space";
 held[k]=true;
 if(k==="r"||k==="R")startGame();
});
document.addEventListener("keyup",e=>{
 let k=e.key===" "?"Space":e.key;
 held[k]=false;
});

document.querySelectorAll("[data-move]").forEach(btn=>{
 const k=["ArrowUp","ArrowRight","ArrowDown","ArrowLeft"][Number(btn.dataset.move)];
 const down=e=>{e.preventDefault();held[k]=true;};
 const up=e=>{e.preventDefault();held[k]=false;};
 btn.addEventListener("pointerdown",down);
 btn.addEventListener("pointerup",up);
 btn.addEventListener("pointercancel",up);
 btn.addEventListener("lostpointercapture",up);
 btn.addEventListener("contextmenu",e=>e.preventDefault());
});
$("fire").addEventListener("pointerdown",e=>{
 e.preventDefault();held.fire=true;
});
["pointerup","pointercancel","pointerleave"].forEach(ev=>{
 $("fire").addEventListener(ev,()=>held.fire=false);
});
buildWorld();
draw();
updateHUD();
requestAnimationFrame(loop);
})();
</script>
</body>
</html>
